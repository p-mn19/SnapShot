<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Snapshot — My Backups</title>
  <link rel="stylesheet" href="../styles/shared.css" />
  <style>
    .card { max-width: 480px; }
    .backup-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .backup-item {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .backup-info .date {
      font-size: 13px;
      font-weight: 600;
    }
    .backup-info .counts {
      font-size: 12px;
      color: #6b7280;
      margin-top: 2px;
    }
    .backup-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .backup-actions button {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    .icon-btn.restore { background: #2563eb; color: #fff; }
    .icon-btn.download { background: #f3f4f6; color: #1a1a1a; }
    .icon-btn.delete { background: #fef2f2; color: #dc2626; }
    .empty-state {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      padding: 30px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>My Backups</h1>

    <div id="loadingState" class="empty-state">Loading your backups…</div>
    <div id="emptyState" class="empty-state" style="display: none;">
      No backups saved yet. Export a workspace and choose "Save to account" to see it here.
    </div>

    <div id="backupList" class="backup-list"></div>

    <div class="actions">
      <button id="closeBtn" class="btn secondary">Close</button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script src="../config/firebase-config.js"></script>
  <script src="../scripts/auth-service.js"></script>
  <script src="../scripts/workspace-service.js"></script>
  <script src="../scripts/cloud-storage-service.js"></script>
  <script src="../scripts/serializer.js"></script>
  <script src="../scripts/restore-service.js"></script>
  <script src="backups.js"></script>
</body>
</html>
