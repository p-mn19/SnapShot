<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Snapshot — Export</title>
  <link rel="stylesheet" href="../styles/theme.css" />
  <link rel="stylesheet" href="../styles/shared.css" />
</head>
<body>
  <div class="card">
    <h1>Export Workspace</h1>

    <div class="stats">
      <div class="stat-row">
        <span class="label">Windows</span>
        <span id="windowCount" class="value mono">—</span>
      </div>
      <div class="stat-row">
        <span class="label">Groups</span>
        <span id="groupCount" class="value mono">—</span>
      </div>
      <div class="stat-row">
        <span class="label">Tabs</span>
        <span id="tabCount" class="value mono">—</span>
      </div>
    </div>

    <div class="actions">
      <button id="exportBtn" class="btn primary" disabled>Export (Download File)</button>
      <button id="cancelBtn" class="btn secondary">Cancel</button>
    </div>

    <div class="actions" style="margin-top: 8px;">
      <button id="saveToAccountBtn" class="btn secondary" disabled>Save to Account</button>
    </div>
    <p id="signInHint" class="muted" style="text-align: center; margin-top: 8px; display: none;">
      Sign in from the popup to save backups to your account.
    </p>

    <div id="status" class="status"></div>
  </div>

  <script src="../scripts/theme-manager.js"></script>
  <script src="../config/firebase-config.js"></script>
  <script src="../scripts/auth-service.js"></script>
  <script src="../scripts/workspace-service.js"></script>
  <script src="../scripts/serializer.js"></script>
  <script src="../scripts/cloud-storage-service.js"></script>
  <script src="export.js"></script>
</body>
</html>
