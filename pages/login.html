<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Snapshot — Sign In</title>
  <link rel="stylesheet" href="../styles/theme.css" />
  <link rel="stylesheet" href="../styles/shared.css" />
</head>
<body>
  <div class="card">
    <h1>Sign in to Snapshot</h1>
    <p class="muted" style="margin-bottom: 24px;">
      Signing in lets you save backups to your account, so you can recover
      your tabs even if this device is lost or reset.
    </p>

    <div class="actions">
      <button id="googleSignInBtn" class="btn primary">Sign in with Google</button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script src="../scripts/theme-manager.js"></script>
  <script src="../config/firebase-config.js"></script>
  <script src="../scripts/auth-service.js"></script>
  <script src="login.js"></script>
</body>
</html>
